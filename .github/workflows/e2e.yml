name: E2E (Patrol)

# J6.1-J6.3 (CDC §7.1-§7.2) — scénarios T01/T04 pilotés par Patrol sur un
# émulateur Android réel (hardware-accelerated, ubuntu-latest — voir
# https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/),
# contre le Firebase Emulator Suite (auth + firestore + storage) démarré dans
# ce même job — jamais le vrai projet greenaccess-16d25.
#
# Déclenchement manuel uniquement (workflow_dispatch) : un run complet prend
# 10-15 min (boot de l'émulateur Android inclus), bien plus coûteux qu'un
# `flutter test` classique — à lancer à la demande plutôt qu'à chaque push,
# contrairement à `ci.yml`. `patrol_test/` reste analysé par `flutter
# analyze` dans ci.yml à chaque push (déclarations de types vérifiées), seule
# l'exécution réelle sur émulateur Android est réservée à ce workflow.
#
# Non reproductible dans le Codespace de développement (aucun émulateur/adb
# disponible — voir README.md §7) : ce workflow est le seul endroit où ces
# scénarios tournent réellement, en local un poste avec Android Studio peut
# aussi les lancer via `patrol test`.

on:
  workflow_dispatch:

jobs:
  e2e:
    name: patrol test (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # Mêmes clés client publiques que lib/firebase_options.dart, projet
      # greenaccess-16d25 — jamais contacté ici, seul l'émulateur local l'est
      # (voir --dart-define=USE_EMULATOR=true plus bas).
      - name: Write google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "590719492442",
              "project_id": "greenaccess-16d25",
              "storage_bucket": "greenaccess-16d25.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:590719492442:android:7cf4b981965ba918209363",
                  "android_client_info": { "package_name": "com.greenaccess.greenaccess" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDYx9XiqjJxVSndd5XzXp18u1T85B_srrU" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Cap Gradle memory for CI
        run: |
          cat > android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.incremental=false
          PROPS

      - run: flutter pub get

      - name: Activate patrol_cli
        run: dart pub global activate patrol_cli

      # Auth + Firestore + Storage seulement : ni T01 ni T04 n'appellent de
      # Cloud Function (calculerScoreClimat n'est exercé que par le
      # formulaire de scoring, hors périmètre de ces deux scénarios) —
      # évite d'installer/builder functions/ dans ce job dédié E2E.
      - run: npm install -g firebase-tools
      - name: Démarrer le Firebase Emulator Suite en arrière-plan
        run: |
          firebase emulators:start --project=greenaccess-16d25 --only auth,firestore,storage \
            > /tmp/firebase-emulators.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000 > /dev/null; then
              echo "Émulateurs prêts."
              exit 0
            fi
            sleep 2
          done
          echo "Émulateurs non prêts après 60 s :" && cat /tmp/firebase-emulators.log && exit 1

      # AVD caching (best practice reactivecircus/android-emulator-runner) —
      # accélère les runs suivants.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33

      - name: Create AVD snapshot (si pas en cache)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Snapshot AVD créé."

      # 10.0.2.2 = alias standard de l'hôte du runner depuis l'émulateur
      # Android — c'est là que tournent les émulateurs Firebase démarrés
      # ci-dessus (voir lib/main.dart, kEmulatorHost).
      - name: patrol test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            export PATH="$PATH:$HOME/.pub-cache/bin"
            patrol test --dart-define=USE_EMULATOR=true --dart-define=EMULATOR_HOST=10.0.2.2

      - name: Logs des émulateurs Firebase (si échec)
        if: failure()
        run: cat /tmp/firebase-emulators.log || true
