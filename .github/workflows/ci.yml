name: CI

# J1.1 — pipeline : analyze → test → build web / build apk debug (CDC §2.3, §8 S10)
# J1.2 — cache pub + Gradle pour accélérer les runs suivants
# J2.2 — job "integration" : Firestore Security Rules testées contre l'émulateur
#        (@firebase/rules-unit-testing, voir firestore-tests/)
# J2.3-J2.6 — job "flutter_integration" : AuthRepository/ScoreRepository/
#        FinancementRepository/CoursRepository testés en vrai contre les
#        émulateurs (flutter test --platform chrome), voir test/integration/

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: flutter test
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter test --coverage --exclude-tags=integration

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: firestore rules (emulator)
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm (firestore-tests)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-firestore-tests

      - run: npm install -g firebase-tools

      - run: npm --prefix firestore-tests install

      - name: Firestore Security Rules tests (émulateur)
        run: firebase emulators:exec --project=greenaccess-16d25 --only firestore "npm --prefix firestore-tests test"

  flutter_integration:
    name: flutter integration tests (emulator)
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: npm install -g firebase-tools

      - name: Compile les Cloud Functions (nécessaire pour l'émulateur Functions)
        run: |
          npm --prefix functions install
          npm --prefix functions run build

      - run: flutter pub get

      # AuthRepository (J2.3) et ScoreRepository (J2.4) contre de vrais
      # émulateurs Auth/Firestore/Functions. `--platform chrome` est requis :
      # `flutter test` classique tourne dans la VM Dart, sans platform
      # channels, donc les plugins firebase_* ne peuvent pas parler à un
      # émulateur (voir README.md §7). Chrome est préinstallé sur les
      # runners ubuntu-latest.
      - name: Tests d'intégration Flutter (émulateurs)
        run: |
          firebase emulators:exec --project=greenaccess-16d25 --only auth,firestore,functions \
            "flutter test --tags=integration --platform chrome"

  build_web:
    name: build web
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter build web

  build_apk_debug:
    name: build apk (debug)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # google-services.json : mêmes clés client que lib/firebase_options.dart
      # (déjà versionné) — projet greenaccess-16d25, protégé par les Security Rules.
      - name: Write google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "590719492442",
              "project_id": "greenaccess-16d25",
              "storage_bucket": "greenaccess-16d25.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:590719492442:android:7cf4b981965ba918209363",
                  "android_client_info": { "package_name": "com.greenaccess.greenaccess" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDYx9XiqjJxVSndd5XzXp18u1T85B_srrU" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # gradle.properties du repo est calibré pour une machine de dev (Xmx8G).
      - name: Cap Gradle memory for CI
        run: |
          cat > android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.incremental=false
          PROPS

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: greenaccess-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
