name: CI

# J1.1 — pipeline : analyze → test → build web / build apk debug (CDC §2.3, §8 S10)
# J1.2 — cache pub + Gradle pour accélérer les runs suivants
# J2.2 — job "integration" : Firestore Security Rules testées contre l'émulateur
#        (@firebase/rules-unit-testing, voir firestore-tests/)
# J2.3-J2.6 — AuthRepository/ScoreRepository/FinancementRepository/
#        CoursRepository : tests écrits (integration_test/), mais NON câblés
#        en CI pour le moment — flutter test --platform chrome ET flutter
#        drive+chromedriver bloquent tous les deux indéfiniment sur
#        Firebase.initializeApp() dans cet environnement (diagnostic complet
#        en tête de integration_test/auth_repository_test.dart et README §7).
# J2.9-J2.11 — functions/test/ : tests unitaires purs (node --test + tsx,
#        sans émulateur) de la formule de calculerScoreClimat — poids CDC
#        exacts et bornes 0-100/arrondi.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: flutter test
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter test --coverage

      # J2.27 — résumé de couverture visible dans l'onglet Summary de chaque
      # run (pas seulement dans l'artefact lcov téléchargeable) : total lignes
      # couvertes/testées, comparé à la cible CDC §7.1 (45-55 %). Calculé à la
      # main (awk sur les lignes LH:/LF: de lcov.info) plutôt que via une
      # action tierce (Codecov, etc.) — aucun compte/token externe à configurer.
      - name: Résumé de couverture (lcov)
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            read -r LH LF <<< "$(awk -F: '/^LH:/{lh+=$2} /^LF:/{lf+=$2} END{print lh, lf}' coverage/lcov.info)"
            PCT=$(awk -v lh="$LH" -v lf="$LF" 'BEGIN { if (lf == 0) print "0.00"; else printf "%.2f", (lh / lf) * 100 }')
            {
              echo "### Couverture de code (lcov)"
              echo ""
              echo "| Lignes couvertes | Lignes totales | Couverture | Cible CDC §7.1 |"
              echo "|---|---|---|---|"
              echo "| $LH | $LF | **${PCT} %** | 45-55 % |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Couverture lcov : ${PCT} % (${LH}/${LF} lignes)"
          else
            echo "Aucun fichier coverage/lcov.info généré (flutter test --coverage a-t-il échoué ?)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: backend tests (functions + firestore rules)
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm (firestore-tests + functions)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-backend-${{ hashFiles('firestore-tests/package.json', 'functions/package.json') }}

      - run: npm install -g firebase-tools

      # Tests unitaires purs de la formule de scoring (J2.9-J2.11, J2.12) —
      # pas besoin d'émulateur, juste Node (voir functions/test/).
      - run: npm --prefix functions install
      - run: npm --prefix functions test

      - run: npm --prefix firestore-tests install

      # Tests des triggers Firestore (J2.13-J2.14, functions/test/triggers.test.ts)
      # et des Security Rules (firestore-tests/) — les deux ont besoin de
      # l'émulateur Firestore, regroupés sous un seul démarrage.
      - name: Tests backend contre l'émulateur Firestore
        run: |
          firebase emulators:exec --project=greenaccess-16d25 --only firestore \
            "npm --prefix functions run test:emulator && npm --prefix firestore-tests test"

  build_web:
    name: build web
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter build web

  build_apk_debug:
    name: build apk (debug)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # google-services.json : mêmes clés client que lib/firebase_options.dart
      # (déjà versionné) — projet greenaccess-16d25, protégé par les Security Rules.
      - name: Write google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "590719492442",
              "project_id": "greenaccess-16d25",
              "storage_bucket": "greenaccess-16d25.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:590719492442:android:7cf4b981965ba918209363",
                  "android_client_info": { "package_name": "com.greenaccess.greenaccess" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDYx9XiqjJxVSndd5XzXp18u1T85B_srrU" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # gradle.properties du repo est calibré pour une machine de dev (Xmx8G).
      - name: Cap Gradle memory for CI
        run: |
          cat > android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.incremental=false
          PROPS

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: greenaccess-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
