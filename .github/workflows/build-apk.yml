name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [feat/design-system-overhaul]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # google-services.json : mêmes clés client que lib/firebase_options.dart
      # (déjà versionné) — projet greenaccess-16d25, protégé par les Security Rules.
      - name: Write google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "590719492442",
              "project_id": "greenaccess-16d25",
              "storage_bucket": "greenaccess-16d25.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:590719492442:android:7cf4b981965ba918209363",
                  "android_client_info": { "package_name": "com.greenaccess.greenaccess" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDYx9XiqjJxVSndd5XzXp18u1T85B_srrU" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # gradle.properties du repo est calibré pour une machine de dev (Xmx8G).
      - name: Cap Gradle memory for CI
        run: |
          cat > android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.incremental=false
          PROPS

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --release --split-per-abi
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          SHA=${GITHUB_SHA::7}
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "$GITHUB_WORKSPACE/greenaccess-$SHA-$abi.apk"
          done
          ls -la "$GITHUB_WORKSPACE"/greenaccess-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: greenaccess-apk
          path: greenaccess-*.apk
          if-no-files-found: error
          retention-days: 14
