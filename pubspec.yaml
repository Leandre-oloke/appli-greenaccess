name: greenaccess
description: "Plateforme mobile de micro-financement vert, d'éducation climatique et d'assurance inclusive — Afrique francophone"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3

  # State Management (Riverpod)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # UI Components
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3

  # Local Storage
  shared_preferences: ^2.3.2

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  geolocator: ^13.0.1
  equatable: ^2.0.5
  firebase_messaging: ^15.0.0
  image_picker: ^1.1.2
  pdf: ^3.10.8
  printing: ^5.13.1
  connectivity_plus: ^6.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.3.5
  riverpod_generator: ^2.4.3
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
